- key: kim2026empac
  title: "eMPAC: Unlocking Full Potential of Pointer Authentication in Microcontrollers with Fat Pointers"
  authors: "Sungsoo Kim, Jihoon Kim, <strong>Kyuwon Cho</strong>, Hojoon Lee"
  venue: "European Symposium on Research in Computer Security (ESORICS)"
  abbr: "ESORICS'26"
  year: 2026
  links:
    Full paper: "https://link.springer.com/chapter/10.1007/978-3-032-38692-2_26"
  abstract: >-
    The Pointer Authentication (PA) extension introduced in ARMv8.3-A has significantly raised the bar
    for exploiting memory errors with hardware-accelerated pointer integrity. Unfortunately, its adaptation
    to the M-profile ARM architecture arrived with significantly reduced feature sets. As a result, existing
    works on PA-based system hardening do not apply to ARM-based MCU systems. In this paper, we present the
    eMPAC architecture, which extends the M-profile PA with an ABI extension to unlock its full potential.
    The key idea is to construct a compiler-defined extended architecture that embraces the fat pointer
    design. We show that the eMPAC architecture enables the existing PA-based security measures developed
    for A-profile processors to be applied to M-profile processors with moderate overhead.

